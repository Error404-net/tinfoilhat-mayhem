name: Build tinfoilhat.ppma

# Auto-builds the installable Mayhem external app (tinfoilhat.ppma) by dropping
# this app into a mayhem-firmware checkout and running their Docker build.
# - Every push/PR: builds and uploads the .ppma as a workflow artifact.
# - CalVer tag push (YYYY.MM.patch, e.g. 2026.08.1): attaches to a GitHub Release.

on:
  push:
    branches: [master, main]
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].*"]
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: "mayhem-firmware branch/tag (e.g. v2.4.0, nightly-tag-2026-08-02)"
        default: "v2.4.0"

env:
  FW_REF: v2.4.0  # stable release; must match the firmware running on the device

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Resolve firmware ref
        id: ref
        run: echo "ref=${{ github.event.inputs.firmware_ref || env.FW_REF }}" >> "$GITHUB_OUTPUT"

      - name: Checkout mayhem-firmware (${{ steps.ref.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: portapack-mayhem/mayhem-firmware
          ref: ${{ steps.ref.outputs.ref }}
          submodules: recursive
          path: mayhem

      - name: Graft the app into the firmware tree
        run: |
          set -euo pipefail
          dst=mayhem/firmware/application/external/tinfoilhat
          mkdir -p "$dst"
          cp app/external/tinfoilhat/main.cpp \
             app/external/tinfoilhat/ui_tinfoilhat.cpp \
             app/external/tinfoilhat/ui_tinfoilhat.hpp \
             app/external/tinfoilhat/tinfoilhat_logic.hpp \
             "$dst/"

      - name: Register the app (external.cmake + external.ld)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          # 1) external.cmake — source files + app-list entry
          f = pathlib.Path("mayhem/firmware/application/external/external.cmake")
          s = f.read_text()
          src_anchor = "external/level/ui_level.cpp\n"
          src_block = ("external/level/ui_level.cpp\n\n"
                       "\t#tinfoilhat\n"
                       "\texternal/tinfoilhat/main.cpp\n"
                       "\texternal/tinfoilhat/ui_tinfoilhat.cpp\n")
          if "external/tinfoilhat/main.cpp" not in s:
              assert src_anchor in s, "EXTCPPSRC level anchor not found"
              s = s.replace(src_anchor, src_block, 1)
          list_anchor = "\n\tlevel\n"
          if "\n\ttinfoilhat\n" not in s:
              assert list_anchor in s, "EXTAPPLIST level anchor not found"
              s = s.replace(list_anchor, "\n\tlevel\n\ttinfoilhat\n", 1)
          f.write_text(s)
          print("external.cmake registered tinfoilhat")

          # 2) external.ld — dedicated MEMORY region + SECTIONS block.
          #
          #    Always strip any existing tinfoilhat entries (the firmware release
          #    may already include them at a wrong address) and re-insert at a
          #    computed-and-clamped address. This is unconditional so that a stale
          #    registration in the checked-out firmware never silently wins.
          #
          #    Guard: the loader stages the M4 baseband image at a fixed
          #    M4_CODE_BASE..M4_CODE_BASE+32k scratch window (0x10080000 to
          #    0x10088000), and that copy runs *after* the app image copy. If
          #    an app's memory_location falls inside that window, the baseband
          #    copy silently clobbers the app's own code -- confirmed via
          #    simulator/loader_sim.cpp. Clamp nxt so we can never land there.
          ld = pathlib.Path("mayhem/firmware/application/external/external.ld")
          t = ld.read_text()

          # Strip stale tinfoilhat MEMORY region (one line).
          t = re.sub(r' *ram_external_app_tinfoilhat[^\n]*\n', '', t)
          # Strip stale tinfoilhat SECTIONS block (multi-line, no '}' in content).
          t = re.sub(r'\n    \.external_app_tinfoilhat\b[^}]*\} > ram_external_app_tinfoilhat\n',
                     '\n', t, flags=re.DOTALL)

          orgs = [int(x, 16) for x in re.findall(
              r'ram_external_app_\w+\s+\(rwx\)\s*:\s*org\s*=\s*0x([0-9A-Fa-f]+)', t)]
          M4_CODE_BASE = 0x10080000
          M4_CODE_END = M4_CODE_BASE + 32 * 1024
          nxt = max(orgs) + 0x10000
          if nxt < M4_CODE_END:
              print("clamping tinfoilhat org 0x%08X -> 0x%08X (M4 scratch window guard)" % (nxt, M4_CODE_END))
              nxt = M4_CODE_END
          region = "    ram_external_app_tinfoilhat            (rwx) : org = 0x%08X, len = 32k\n" % nxt

          m = re.search(r'    ram_external_app_level\s+\(rwx\)\s*:\s*org\s*=\s*0x[0-9A-Fa-f]+, len = 32k\n', t)
          assert m, "level MEMORY region not found"
          t = t[:m.end()] + region + t[m.end():]

          sec_anchor = re.search(r'\}\s*>\s*ram_external_app_level\n', t)
          assert sec_anchor, "level SECTIONS block not found"
          sec_block = (
              "\n    .external_app_tinfoilhat : ALIGN(4) SUBALIGN(4)\n    {\n"
              "        KEEP(*(.external_app.app_tinfoilhat.application_information));\n"
              "        *(*ui*external_app*tinfoilhat*);\n"
              "    } > ram_external_app_tinfoilhat\n")
          t = t[:sec_anchor.end()] + sec_block + t[sec_anchor.end():]
          ld.write_text(t)
          print("external.ld: tinfoilhat at 0x%08X" % nxt)
          PY

      # VERSION_STRING must match what the official firmware was built with so
      # that VERSION_MD5 (an 8-char MD5 of the version string) agrees between
      # the running firmware and our .ppma — mismatch = broken icon + error.
      # Stable releases: read from version.txt (e.g. "v2.4.0").
      # Nightly tags:    derive n_YYMMDD from the tag name (mayhem nightly CI
      #                  uses exactly this format).
      - name: Determine VERSION_STRING
        id: fwver
        run: |
          ver=$(cat mayhem/.github/workflows/version.txt 2>/dev/null || true)
          if [ -z "$ver" ]; then
            date_part=$(echo "${{ steps.ref.outputs.ref }}" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tr -d '-' | cut -c3- || true)
            [ -n "$date_part" ] && ver="n_${date_part}"
          fi
          [ -z "$ver" ] && ver="${{ steps.ref.outputs.ref }}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "VERSION_STRING will be: $ver"

      - name: Build Docker image
        working-directory: mayhem
        run: docker build -t portapack-dev -f dockerfile-nogit .

      - name: Compile firmware (produces the .ppma)
        working-directory: mayhem
        run: |
          mkdir -p build
          docker run -e VERSION_STRING=${{ steps.fwver.outputs.version }} -i \
            -v "${{ github.workspace }}/mayhem:/havoc" portapack-dev

      - name: Collect tinfoilhat.ppma + web viewer
        run: |
          set -euo pipefail
          src=$(find mayhem/build/firmware/application -name 'tinfoilhat.ppma' | head -1)
          test -n "$src"
          mkdir -p out
          cp "$src" out/tinfoilhat.ppma
          cp app/external/tinfoilhat/viewer.html out/viewer.html  # drop next to CSVs in SD /TESTS/
          ls -l out

      # Gate: replay the exact v2.4.0 run_external_app() copy loops against the
      # artifact we're about to ship and fail the build if the checksum is bad
      # OR the app's own memory region overlaps the M4 baseband scratch window
      # (see the external.ld guard above -- this is the check that would have
      # caught a bad build before it ever reached a device).
      - name: Verify artifact with loader_sim
        run: |
          g++ -std=c++17 app/simulator/loader_sim.cpp -o /tmp/loader_sim
          /tmp/loader_sim out/tinfoilhat.ppma

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinfoilhat-ppma
          path: out/*

      - name: Attach to release (CalVer tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Tinfoil Hat ${{ github.ref_name }}"
          body: |
            ## Install

            1. Drop `tinfoilhat.ppma` into `/APPS/` on your PortaPack SD card
            2. Drop `viewer.html` into `/TESTS/` on your PortaPack SD card
            3. Boot → Games menu → **Tinfoil Hat**
          files: |
            out/tinfoilhat.ppma
            out/viewer.html
